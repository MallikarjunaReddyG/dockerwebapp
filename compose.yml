version: "3"
services:
  devopsdb:
    image: gangireddymallikarjunareddy/automation:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
    networks:
      - mynetwork
  application:
    image: gangireddymallikarjunareddy/automation:app
    ports:
      - "1111:8080"
    deploy:
      replicas: 3
    depends_on:
      - "devopsdb"
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
